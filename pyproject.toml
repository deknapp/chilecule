[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chilecule"
version = "0.1.0"
description = "Open-source agentic drug discovery workflows built on RDKit and permissively licensed tools"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Nathaniel Knapp" }]
keywords = [
    "drug-discovery", "cheminformatics", "rdkit", "computational-chemistry",
    "molecular-docking", "virtual-screening", "qsar", "admet", "chembl",
    "structure-based-drug-design", "medicinal-chemistry", "bioinformatics",
    "ai-agents", "llm-agents", "mcp", "model-context-protocol", "claude",
    "agentic-ai", "open-science", "smina", "autodock-vina", "sar",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rdkit>=2024.3.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Retrospective validation + QSAR baselines. Pure CPU.
ml = ["scikit-learn>=1.3"]
# Expose the tool layer to any MCP client (Claude Code, Claude Desktop, ...).
mcp = ["mcp>=1.2"]
# Drive the workflows with an agent.
agent = ["claude-agent-sdk>=0.1", "anthropic>=0.40"]
# Cloud burst runner (scaffolded, not implemented -- see docs/ARCHITECTURE.md).
aws = ["boto3>=1.34"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
all = ["chilecule[ml,mcp,agent,dev]"]

[project.urls]
Homepage = "https://github.com/deknapp/chilecule"
Repository = "https://github.com/deknapp/chilecule"
Issues = "https://github.com/deknapp/chilecule/issues"

[project.scripts]
chilecule = "chilecule.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chilecule"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test requires network access (deselect with -m 'not network')",
    "binary: test requires an external binary such as smina or fpocket",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
